<div class="item-box rounded-3 p-3 m-3"
     [ngClass]="(darkMode | async) ? 'border white-shadow' : 'black-border shadow'">
    <h2 class="title">{{ 'items.title' | translate }}</h2>
    <div class="item-section container">
        <div class="row gap-2">
            <!--
              Twelve slots, six per row. This was twelve hand-written copies of the same block, and
              one of them read getItemSprite(5) for slot 6 — so the first slot of the second row
              always showed slot 5's sprite: an empty slot wearing a potion, a mega stone wearing
              whatever sat before it. Driving the slots from a range makes that typo unrepresentable.
            -->
            @for (slot of slots; track slot) {
                <div class="item-container rounded-3 col-2"
                     [class.cursor-pointer]="slot < 3"
                     [ngClass]="(darkMode | async) ? 'border' : 'black-border shadow'">
                    <img [src]="getItemSprite(slot)" class="img-fluid" placement="bottom"
                         ngbTooltip="{{getItemText(slot)}}" (click)="useItem(trainerItems[slot])">
                </div>
            }
        </div>
    </div>
</div>
