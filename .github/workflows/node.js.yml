# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Angular Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    # Fails on a high-or-worse advisory in code that actually ships. Dev-only tooling is
    # excluded deliberately: a DoS in an image parser used by the build is not a user risk,
    # and gating on it would red-wall every PR for something unshippable.
    - run: npm audit --omit=dev --audit-level=high
    - run: npm run build
    - run: npm run test -- --watch=false --browsers=ChromeHeadless